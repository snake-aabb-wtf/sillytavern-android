name: Native parity

# M0 gate for the native client. One job captures the real web UI's /generate
# bodies, then reproduces them headlessly in jsdom and diffs the two field by
# field. SillyTavern's dependencies and the Playwright browser cannot be
# installed on the 1.9 GB build host, so this workflow is the required
# environment.
on:
  push:
    branches:
      - feature/compose-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Capture reference and compare headless build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Only needed to boot the real server; the capture script itself does not
      # import server packages.
      - name: Install SillyTavern dependencies
        working-directory: SillyTavern
        run: npm ci --no-audit --no-fund

      - name: Install native harness dependencies
        working-directory: native
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: native
        run: npx playwright install --with-deps chromium

      - name: Capture reference requests (browser)
        working-directory: native
        run: npm run capture:reference

      - name: Build the same requests headlessly (jsdom) and diff
        working-directory: native
        run: npm run test:headless

      # The step above runs against the unpruned checkout. Re-run the fixtures
      # against a copy pruned by the same script staging uses, so an asset that
      # jsdom actually needs cannot hide in webfonts/img/css/sounds and ship.
      - name: Re-run the fixtures against a pruned tree
        working-directory: native
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          copy="$work/SillyTavern"
          cp -a ../SillyTavern "$copy"
          ../scripts/prune-public.sh "$copy"
          if [[ -d "$copy/public/css" ]]; then
            echo "::error::prune-public.sh left public/css in the copy"
            exit 1
          fi
          NATIVE_SERVER_DIR="$copy" node test/build-headless.mjs

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generate-bodies
          path: |
            fixtures/reference
            fixtures/headless
          if-no-files-found: error
          retention-days: 14

  # R5 probe in its own job so it starts immediately and its logs are not
  # buried behind the 7-minute Playwright capture. Boots the prompt-builder
  # worker (the route's production path), prints cold boot and per-request
  # time-to-first-byte, samples a health endpoint while each build is in
  # flight, and FAILS the job above the 3000 ms warm budget.
  native-latency:
    name: Measure latency and chat isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SillyTavern dependencies
        working-directory: SillyTavern
        run: npm ci --no-audit --no-fund

      - name: Install native harness dependencies
        working-directory: native
        run: npm ci --no-audit --no-fund

      - name: Measure /api/native/chat latency
        working-directory: native
        run: node test/latency-native-chat.mjs

      # Finding 1: build() must not leak the canned SSE reply into the chat or
      # write it to disk, or the next prompt replays "ok" as real history.
      # Runs even when the latency gate above is red: a flaky 3 s sample must
      # not hide a chat-integration regression.
      - name: Assert chat state survives two builds unchanged
        if: always()
        working-directory: native
        run: node test/chat-state-isolation.mjs

      # Turn 1 now adopts the character without getChatResult(), so this guards
      # the state it establishes: this_chid (world info) and name2 ({{char}}).
      - name: Assert the character lorebook survives two turns
        if: always()
        working-directory: native
        run: node test/world-info-turns.mjs

  # Proves the shipped artifact, not just the sources: stage-runtime.sh applies
  # the native/ overlay to dist/runtime/server and appends the mount to the
  # staged src/server-main.js. The check boots that copy and expects the route
  # to answer 400 (empty body) ahead of the terminal 404 middleware.
  native-endpoint:
    name: Stage runtime and verify /api/native mount
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage the runtime with the native overlay
        run: bash scripts/stage-runtime.sh

      - name: Verify /api/native answers on the staged copy
        run: bash scripts/verify-native-endpoint.sh dist/runtime

      - name: Upload staging boot log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-endpoint-stage-log
          path: |
            dist/stage-boot.log
            dist/native-endpoint.log
          if-no-files-found: ignore
          retention-days: 14
